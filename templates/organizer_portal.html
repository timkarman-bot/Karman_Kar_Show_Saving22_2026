{% extends "base.html" %}
{% set title = "Organizer Access" %}
{% block content %}
<div class="mx-auto max-w-5xl">
  <div class="mb-8">
    <div class="text-xs font-semibold text-slate-500">SHOW ORGANIZERS</div>
    <h1 class="mt-1 text-3xl font-semibold">Run your event on Karman</h1>
    <p class="mt-2 max-w-2xl text-slate-600">Create and manage shows, collect registrations and votes, and keep every payment tied to one event reference.</p>
  </div>
  <div class="grid gap-8 md:grid-cols-2">
    <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">Sign in</h2>
      <form method="post" action="{{ url_for('organizer_login') }}" class="mt-5 space-y-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div><label class="text-sm font-semibold">Email</label><input type="email" name="email" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        <div><label class="text-sm font-semibold">Password</label><input type="password" name="password" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        <button class="btn btn-primary w-full">Sign in</button>
      </form>
    </section>
    <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">Create an organizer account</h2>
      <form method="post" action="{{ url_for('organizer_signup') }}" class="mt-5 space-y-4">
        <div><label class="text-sm font-semibold">Organization</label><input name="organization_name" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        <div><label class="text-sm font-semibold">Contact name</label><input name="contact_name" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label class="text-sm font-semibold">Email</label><input type="email" name="email" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
          <div><label class="text-sm font-semibold">Phone</label><input name="phone" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        </div>
        <div><label class="text-sm font-semibold">Password</label><input type="password" name="password" minlength="10" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
        <button class="btn btn-primary w-full">Create account</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
