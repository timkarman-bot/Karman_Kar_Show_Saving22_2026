{% extends "base.html" %}
{% set title = "Create Show" %}
{% block content %}
<div class="mx-auto max-w-4xl">
  <div class="flex items-center justify-between gap-4"><div><div class="text-xs font-semibold text-slate-500">NEW SHOW</div><h1 class="mt-1 text-3xl font-semibold">Create a draft event</h1></div><a class="btn btn-outline" href="{{ url_for('organizer_dashboard') }}">Cancel</a></div>
  <form method="post" class="mt-8 space-y-8">
    <section class="border-t border-slate-200 pt-6"><h2 class="text-lg font-semibold">Event details</h2><div class="mt-4 grid gap-4 md:grid-cols-2">
      <div class="md:col-span-2"><label class="text-sm font-semibold">Show name</label><input name="title" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
      <div><label class="text-sm font-semibold">Date</label><input type="date" name="date" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div><div><label class="text-sm font-semibold">Time</label><input name="time" placeholder="10:00 AM - 3:00 PM" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
      <div><label class="text-sm font-semibold">Venue</label><input name="location_name" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div><div><label class="text-sm font-semibold">Address</label><input name="address" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
      <div class="md:col-span-2"><label class="text-sm font-semibold">Charity</label><input name="charity_name" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div><div class="md:col-span-2"><label class="text-sm font-semibold">Description</label><textarea name="description" rows="4" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></textarea></div>
    </div></section>
    <section class="border-t border-slate-200 pt-6"><h2 class="text-lg font-semibold">Pricing</h2><div class="mt-4 grid gap-4 sm:grid-cols-3"><div><label class="text-sm font-semibold">Registration ($)</label><input name="registration_fee" value="35.00" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div><div><label class="text-sm font-semibold">Admission ($)</label><input name="attendee_fee" value="10.00" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div><div><label class="text-sm font-semibold">Price per vote ($)</label><input name="vote_price" value="1.00" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div></div></section>
    <section class="border-t border-slate-200 pt-6"><h2 class="text-lg font-semibold">Payment collection</h2><div class="mt-4 grid gap-3">
      <label class="flex gap-3 rounded-lg border border-slate-300 bg-white p-4"><input type="radio" name="payment_collection_mode" value="platform" checked><span><strong>Karman collects payments</strong><span class="mt-1 block text-sm text-slate-600">Payments use the Karman Stripe account. Settlement deducts a 10% platform fee plus Stripe processing fees.</span></span></label>
      <label class="flex gap-3 rounded-lg border border-slate-300 bg-white p-4"><input type="radio" name="payment_collection_mode" value="external"><span><strong>Use an external payment page</strong><span class="mt-1 block text-sm text-slate-600">Transactions require review and are not automatically reconciled through Karman Stripe.</span></span></label>
      <div><label class="text-sm font-semibold">External payment URL</label><input type="url" name="external_payment_url" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"></div>
    </div></section>
    <section class="border-t border-slate-200 pt-6"><div class="grid gap-4 sm:grid-cols-2"><div><label class="text-sm font-semibold">Voting</label><select name="voting_mode" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-3"><option value="fundraiser_unlimited">Fundraiser voting</option><option value="restricted_single">Restricted voting</option><option value="none">No voting</option></select></div><label class="flex items-center gap-3 pt-7"><input type="checkbox" name="allow_sponsorships" checked> Accept sponsorships</label></div></section>
    <div class="flex justify-end"><button class="btn btn-primary">Create Draft Show</button></div>
  </form>
</div>
{% endblock %}
